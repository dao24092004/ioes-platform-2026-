enabled: true

nameOverride: content-service
fullnameOverride: ioes-content-service

replicaCount: 3

image:
  repository: ghcr.io/ioes-platform/content-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 9001
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9001"
    prometheus.io/path: "/actuator/prometheus"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: content.ioes.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: content-service-tls
      hosts:
        - content.ioes.local

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "9001"
  DB_HOST: "ioes-postgres"
  DB_PORT: "5432"
  DB_NAME: "ioes_content"
  DB_USERNAME: "ioes"
  DB_PASSWORD: ""
  REDIS_HOST: "ioes-redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "ioes-kafka:9092"
  MONGO_HOST: "ioes-mongodb"
  MONGO_PORT: "27017"
  # Replica set name must match docker-compose / production Mongo config.
  MONGO_REPLICA_SET: "rs0"
  MONGO_DB_NAME: "ioes_content"
  MONGO_USERNAME: "ioes_content_user"
  MONGO_PASSWORD: ""
  # Auth source is always `admin` because users are created there.
  MONGO_AUTH_SOURCE: "admin"
  MINIO_ENDPOINT: "http://ioes-minio:9000"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-service:9999/eureka/"
  JAVA_OPTS: "-Xms512m -Xmx1536m -XX:+UseG1GC"

secrets:
  create: false
  existingSecret: content-service-secrets

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 9001
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 9001
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

serviceMonitor:
  enabled: true
  interval: 15s
  path: /actuator/prometheus
  scrapeTimeout: 10s

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: content-service

namespace: ioes