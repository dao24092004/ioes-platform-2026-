enabled: true

nameOverride: blockchain-suite
fullnameOverride: ioes-blockchain-suite

replicaCount: 2

image:
  repository: ghcr.io/ioes-platform/blockchain-suite
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 9200
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9200"
    prometheus.io/path: "/metrics"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: blockchain.ioes.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: blockchain-suite-tls
      hosts:
        - blockchain.ioes.local

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  NODE_ENV: "production"
  PORT: "9200"
  DB_HOST: "ioes-postgres"
  DB_PORT: "5432"
  DB_NAME: "ioes_blockchain"
  DB_USERNAME: "ioes"
  DB_PASSWORD: ""
  REDIS_HOST: "ioes-redis"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "ioes-kafka:9092"
  BLOCKCHAIN_NETWORK: "polygon"
  IPFS_HOST: "ioes-ipfs"
  IPFS_PORT: "5001"

secrets:
  create: false
  existingSecret: blockchain-suite-secrets

livenessProbe:
  httpGet:
    path: /health
    port: 9200
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: 9200
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics
  scrapeTimeout: 10s

podDisruptionBudget:
  enabled: true
  minAvailable: 1

namespace: ioes