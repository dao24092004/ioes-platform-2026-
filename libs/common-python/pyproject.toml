[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ioes-common"
version = "1.0.0"
description = "IOES Common Library for Python - Shared schemas, ML utilities, FastAPI dependencies"
authors = ["IOES Team <devops@ioes.com>"]
license = "Proprietary"
readme = "README.md"
packages = [{ include = "ioes_common" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
python-multipart = "^0.0.9"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
httpx = "^0.27.0"
opentelemetry-api = "^1.24.0"
opentelemetry-sdk = "^1.24.0"
opentelemetry-instrumentation-fastapi = "^0.45b0"
opentelemetry-instrumentation-pydantic = "^0.45b0"
opentelemetry-exporter-otlp = "^1.24.0"
tenacity = "^8.2.3"
structlog = "^24.1.0"
prometheus-client = "^0.20.0"
numpy = "^1.26.0"

[tool.poetry.dev-dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
ruff = "^0.3.0"
mypy = "^1.9.0"
black = "^24.2.0"
mongomock = "^4.1.2"
fakeredis = "^2.21.3"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers --tb=short"
asyncio_mode = "auto"
