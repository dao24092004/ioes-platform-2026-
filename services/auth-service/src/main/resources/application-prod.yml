# ============================================
# auth-service - Production Profile
# ============================================
spring:
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true

logging:
  level:
    com.ioes: INFO
    root: WARN

jwt:
  secret: ${JWT_SECRET}
  issuer: ioes-platform
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
