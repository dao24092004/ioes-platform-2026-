server:
  port: 9000
  shutdown: graceful

spring:
  application:
    name: auth-service
  profiles:
    active: local
  cloud:
    config:
      uri: http://localhost:8888
      name: auth-service
      profile: local
      fail-fast: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${AUTH_DB_NAME:ioes_auth}
    username: ${POSTGRES_USER:ioes}
    password: ${POSTGRES_PASSWORD:ioes_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: auth-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9999/eureka/
  instance:
    prefer-ip-address: true

# JWT Configuration
# CRITICAL (ADR-008): JWT_SECRET được load TRỰC TIẾP từ env var.
# KHÔNG có default fallback trong code — tránh lộ secret qua source.
# Set JWT_SECRET trong .env (dev) hoặc K8s Secret (prod).
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  issuer: ${JWT_ISSUER:ioes-platform}

# Password Configuration
password:
  min-length: 8
  hash-iterations: 12

# OAuth2 Configuration
oauth2:
  redirect-uri: http://localhost:3000/auth/oauth2/callback

# Email Verification
verification:
  email-token-expiration: 86400000   # 24 hours
  reset-token-expiration: 3600000    # 1 hour

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: auth-service
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.ioes: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO