# ============================================
# auth-service - Local Development Profile
# ============================================
spring:
  cloud:
    config:
      enabled: false
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false

logging:
  level:
    com.ioes: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO

jwt:
  # ADR-008: KHÔNG default fallback — secret được load trực tiếp từ JWT_SECRET env
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:ioes-platform}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

management:
  endpoint:
    health:
      show-details: always
