server:
  port: 9001

spring:
  application:
    name: content-service
  cloud:
    config:
      import-check:
        enabled: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ioes_content}
    username: ${DB_USER:ioes}
    password: ${DB_PASSWORD:ioes_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

ioes:
  kafka:
    topics: content.topic.created,content.topic.updated,content.topic.deleted

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:9999}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ioes: DEBUG
    org.springframework.kafka: INFO