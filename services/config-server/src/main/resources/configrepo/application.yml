# ============================================
# IOES Config Server - Shared Configuration
# This file is the BASE configuration loaded by all services
# ============================================

spring:
  application:
    name: ${service.name:unknown-service}

  # ============================================
  # DATABASE CONFIGURATION
  # ============================================
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${AUTH_DB_NAME:ioes_auth}
    username: ${POSTGRES_USER:ioes}
    password: ${POSTGRES_PASSWORD:ioes_dev_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ${spring.application.name}-HikariPool

  # ============================================
  # REDIS CONFIGURATION
  # ============================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000

  # ============================================
  # KAFKA CONFIGURATION
  # ============================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

# ============================================
# SERVER CONFIGURATION
# ============================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 30000
    max-connections: 10000

# ============================================
# OBSERVABILITY CONFIGURATION
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,refresh
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.ioes: DEBUG
    org.springframework.web: INFO
    org.springframework.kafka: INFO
  file:
    name: logs/${spring.application.name}.log
    max-size: 10MB
    max-history: 30

# ============================================
# JWT CONFIGURATION
# ADR-008: NO DEFAULT FALLBACK — JWT_SECRET required from env.
# ============================================
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}    # 15 minutes
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 days
  issuer: ${JWT_ISSUER:ioes-platform}

# ============================================
# API CONFIGURATION
# ============================================
api:
  gateway:
    url: ${API_GATEWAY_URL:http://localhost:8080}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

# ============================================
# MINIO/S3 CONFIGURATION
# ============================================
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minio}
  secret-key: ${MINIO_ROOT_PASSWORD:minio123}
  bucket:
    media: ioes-media
    certificates: ioes-certificates
    proctoring: ioes-proctoring

# ============================================
# RESILIENCE CONFIGURATION
# ============================================
resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
  retry:
    instances:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  timelimiter:
    instances:
      default:
        # Resilience4j mac dinh 1 giay. Route nao co filter CircuitBreaker ma
        # cham hon 1 giay deu bi cat va roi vao fallback, tra 500 — ke ca khi
        # service dich da tra loi thanh cong. Loi nay anh huong moi service,
        # khong rieng ai-suite.
        #
        # 30s de du cho mot luot goi mo hinh ngon ngu. Do thuc te tren
        # gemini-3.5-flash-lite: 0.8-2s binh thuong, 13s khi Gemini phai suy
        # luan nhieu.
        timeoutDuration: 30s
        cancelRunningFuture: true
  ratelimiter:
    instances:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0
