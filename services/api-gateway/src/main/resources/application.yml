server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  profiles:
    active: local
  cloud:
    config:
      uri: http://localhost:8888
      name: api-gateway
      profile: local
      fail-fast: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9999/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

# ============================================
# JWT - PHẢI GIỐNG auth-service
# ADR-008: KHÔNG có default fallback. Set JWT_SECRET qua env.
# ============================================
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  issuer: ${JWT_ISSUER:ioes-platform}

# ============================================
# ROUTES
# ============================================
spring.cloud.gateway:
  discovery:
    locator:
      enabled: true
      lower-case-service-id: true
  routes:
    # Auth Service
    - id: auth-service
      uri: lb://auth-service
      predicates:
        - Path=/api/auth/**
      filters:
        - StripPrefix=2

    # Content Service
    - id: content-service
      uri: lb://content-service
      predicates:
        - Path=/api/content/**,/api/courses/**,/api/lessons/**,/api/topics/**,/api/v1/topics/**
      filters:
        - StripPrefix=2

    # Exam Service (controllers @Controller('exams') / @Controller('attempts'),
    # nên chỉ cắt đoạn /api)
    - id: exam-suite
      uri: http://localhost:9005
      predicates:
        - Path=/api/exams/**,/api/attempts/**
      filters:
        - StripPrefix=1

    # Exam session: @Controller('api/v1/exam-attempts') đã tự mang tiền tố
    # /api/v1, nên không cắt đoạn nào.
    - id: exam-session
      uri: http://localhost:9005
      predicates:
        - Path=/api/v1/exam-attempts/**

    # Question Bank (nested path, strip only 1 segment)
    - id: question-bank
      uri: http://localhost:9005
      predicates:
        - Path=/api/question-bank/**
      filters:
        - StripPrefix=1

    # Analytics Service (controller @RequestMapping("/analytics"), strip only 1)
    - id: analytics-service
      uri: lb://analytics-service
      predicates:
        - Path=/api/analytics/**
      filters:
        - StripPrefix=1

    # Notification Service (controller @RequestMapping("/notifications"), strip only 1)
    - id: notification-service
      uri: lb://notification-service
      predicates:
        - Path=/api/notifications/**
      filters:
        - StripPrefix=1

    # Blockchain Service
    - id: blockchain-suite
      uri: lb://blockchain-suite
      predicates:
        - Path=/api/blockchain/**,/api/certificates/**
      filters:
        - StripPrefix=2

    # AI Service
    - id: ai-suite
      uri: lb://ai-suite
      predicates:
        - Path=/api/ai/**,/api/learning-path/**,/api/recommendations/**
      filters:
        - StripPrefix=2

# ============================================
# GLOBAL FILTERS
# ============================================
spring.cloud.gateway.default-filters:
  - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
  - name: Retry
    args:
      retries: 3
      statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
      backoff:
        firstBackoff: 100ms
        maxBackoff: 500ms
        factor: 2

# ============================================
# HTTP CLIENT TIMEOUTS (WebFlux/Netty)
# ============================================
spring.cloud.gateway.httpclient:
  # Kết nối TCP đến downstream service
  connect-timeout: 5000
  # Thời gian chờ response từ downstream (mặc định = unlimited)
  response-timeout: 30s
  # Tắt max-idle (mặc định 0 = infinite idle - giữ connection)
  max-idle-time: 60s

# ============================================
# WEBCLIENT TIMEOUTS (cho circuit breaker)
# ============================================
spring.codec.max-in-memory-size: 5MB

# ============================================
# MANAGEMENT
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: api-gateway
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.ioes: DEBUG
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
    redisratelimiter: INFO