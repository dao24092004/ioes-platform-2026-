[tool.poetry]
name = "ioes-ocr-service"
version = "1.0.0"
description = "OCR service for handwritten exam answers"
authors = ["IOES Team <devops@ioes.com>"]
license = "Proprietary"
readme = "README.md"
packages = [{ include = "ocr_service" }]

[tool.poetry.dependencies]
python = "^3.11"
ioes-common = { path = "../../../libs/common-python", develop = true }
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
aiokafka = "^0.10.0"
httpx = "^0.27.0"
pillow = "^10.2.0"
pytesseract = "^0.3.10"

[tool.poetry.dev-dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.5"
ruff = "^0.3.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
