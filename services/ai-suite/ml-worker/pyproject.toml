[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ioes-ml-worker"
version = "1.0.0"
description = "IOES ML Worker (embeddings, grading, recommendation inference)"
authors = ["IOES Team <devops@ioes.com>"]
license = "Proprietary"
readme = "README.md"
packages = [{ include = "ml_worker", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
ioes-common = { path = "../../../libs/common-python", develop = true }
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
aiokafka = "^0.10.0"
httpx = "^0.27.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.29" }
asyncpg = "^0.29.0"
redis = "^5.0.3"
numpy = "^1.26.0"
pillow = "^10.2.0"

# RAG stack — LangChain
langchain = "^0.3.0"
langchain-core = "^0.3.0"
langchain-milvus = "^0.1.6"
langchain-huggingface = "^0.1.2"
langchain-openai = "^0.2.0"
langchain-text-splitters = "^0.3.0"
pymilvus = "^2.4.0"

[tool.poetry.group.ml.dependencies]
torch = "^2.2.0"
transformers = "^4.39.0"
sentence-transformers = "^2.6.0"
scikit-learn = "^1.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
ruff = "^0.3.0"
mypy = "^1.9.0"
black = "^24.2.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
