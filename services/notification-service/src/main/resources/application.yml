server:
  port: 9009
  shutdown: graceful

spring:
  application:
    name: notification-service
  profiles:
    active: local
  cloud:
    config:
      uri: http://localhost:8888
      name: notification-service
      profile: local
      fail-fast: false
  datasource:
    url: jdbc:postgresql://localhost:5432/ioes_notification
    username: ioes
    password: ioes_dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9999/eureka/
  instance:
    prefer-ip-address: true

# Email Configuration
email:
  from: noreply@ioes.local
  from-name: IOES Platform
  templates:
    base-path: classpath:/templates/

# Notification Configuration
notification:
  retry:
    max-attempts: 3
    backoff-ms: 1000
  queue:
    enabled: true
    processing-interval-ms: 5000

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: notification-service
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.ioes: DEBUG
    org.springframework.kafka: INFO