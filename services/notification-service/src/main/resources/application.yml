server:
  port: 9009
  shutdown: graceful

spring:
  application:
    name: notification-service
  profiles:
    active: local
  cloud:
    config:
      uri: http://localhost:8888
      name: notification-service
      profile: local
      fail-fast: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${NOTIFICATION_DB_NAME:ioes_notification}
    username: ${POSTGRES_USER:ioes}
    password: ${POSTGRES_PASSWORD:ioes_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9999/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  issuer: ${JWT_ISSUER:ioes-platform}

# Email Configuration
email:
  from: noreply@ioes.local
  from-name: IOES Platform
  templates:
    base-path: classpath:/templates/

# Notification Configuration
notification:
  retry:
    max-attempts: 3
    backoff-ms: 1000
  queue:
    enabled: true
    processing-interval-ms: 5000

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: notification-service
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.ioes: DEBUG
    org.springframework.kafka: INFO
    